services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dargaze
      POSTGRES_USER: dargaze
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dargaze -d dargaze"]
      interval: 5s
      timeout: 4s
      retries: 12
    networks: [private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 4s
      retries: 12
    networks: [private]

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      TRUST_PROXY: "true"
      PUBLIC_URL: https://${PUBLIC_DOMAIN:-localhost}
      FRONTEND_ORIGINS: https://${PUBLIC_DOMAIN:-localhost}
      DATABASE_URL: postgres://dargaze:${POSTGRES_PASSWORD}@postgres:5432/dargaze
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set a long random JWT_SECRET in .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set a separate TOTP_ENCRYPTION_KEY in .env}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-Dargaze <no-reply@example.com>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://${PUBLIC_DOMAIN:-localhost}/api/auth/google/callback}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ["3001"]
    networks: [private]

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    expose: ["80"]
    depends_on: [api]
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    networks: [private]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge
